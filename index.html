<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Jam 空中即興</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage" id="stage">
    <video id="camera" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="hud" hidden>
    <div class="progress"><div id="progressFill"></div></div>
    <div class="hud-row">
      <div class="hud-box chord-now">
        <div class="label" data-i18n="hud.chordNow"></div>
        <div id="chordNow">–</div>
      </div>
      <div class="hud-box chord-next" id="chordNextBox">
        <div class="label" data-i18n="hud.chordNext"></div>
        <div id="chordNext">–</div>
        <div class="label" id="chordNextIn"></div>
      </div>
      <div class="beat-dots" id="beatDots"><span></span><span></span><span></span><span></span></div>
      <div class="hud-spacer"></div>
      <button id="gearButton" class="gear secondary" type="button" aria-expanded="false" aria-controls="menuPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8.2 4.7-1.9-.3a6.6 6.6 0 0 1-.6 1.5l1.1 1.6-1.6 1.6-1.6-1.1c-.5.3-1 .5-1.5.6l-.3 1.9h-2.3l-.3-1.9a6.6 6.6 0 0 1-1.5-.6l-1.6 1.1-1.6-1.6 1.1-1.6a6.6 6.6 0 0 1-.6-1.5l-1.9-.3v-2.3l1.9-.3c.1-.5.3-1 .6-1.5L4.5 7.3l1.6-1.6 1.6 1.1c.5-.3 1-.5 1.5-.6l.3-1.9h2.3l.3 1.9c.5.1 1 .3 1.5.6l1.6-1.1 1.6 1.6-1.1 1.6c.3.5.5 1 .6 1.5l1.9.3v2.3Z"/></svg><span data-i18n="menu.gear"></span></button>
      <div class="hud-box score">
        <div class="label" data-i18n="hud.score"></div>
        <div id="score">0</div>
        <div id="combo"></div>
      </div>
    </div>
  </div>

  <div id="songInfo" hidden></div>
  <div id="status"></div>
  <div id="help" hidden></div>
  <div id="toast" hidden></div>

  <div id="ready" hidden>
    <div class="ready-title" data-i18n="ready.title"></div>
    <div class="ready-buttons">
      <button id="startButton" data-i18n="ready.start"></button>
      <button id="settingsButton" class="secondary" type="button" data-menu="open" data-i18n="menu.open"></button>
    </div>
    <div class="hint" data-i18n="ready.hint"></div>
    <div class="hint" data-i18n="ready.settingsHint"></div>
  </div>

  <!-- Settings panel (gear), src/app/menu.js. Buttons show their state; the keys in <kbd> still work. -->
  <section id="menuPanel" class="menu-panel" hidden aria-labelledby="menuTitle">
    <div class="menu-head">
      <h3 id="menuTitle" data-i18n="menu.title"></h3>
      <span class="menu-note" data-i18n="menu.saved"></span>
    </div>
    <div class="menu-cols">
      <div class="menu-col">
        <div class="menu-group">
          <div class="menu-label"><span data-i18n="menu.tone"></span><kbd>T</kbd><span class="menu-extra" id="menuToneOther"></span></div>
          <div class="menu-row" id="menuTones"></div>
        </div>
        <div class="menu-group">
          <div class="menu-label"><span data-i18n="menu.snap"></span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></div>
          <div class="menu-row">
            <button class="mini secondary" type="button" data-snap="chord" data-i18n="menu.snap.chord"></button>
            <button class="mini secondary" type="button" data-snap="scale" data-i18n="menu.snap.scale"></button>
            <button class="mini secondary" type="button" data-snap="free" data-i18n="menu.snap.free"></button>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-label"><span data-i18n="menu.pedals"></span></div>
          <div class="menu-row">
            <button class="mini secondary" type="button" data-menu="pedals" aria-pressed="false" data-i18n="menu.pedalsShow"></button>
            <button class="mini secondary" type="button" data-menu="tuning"><span data-i18n="menu.tuning"></span><kbd>P</kbd></button>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-label"><span data-i18n="menu.input"></span><kbd>M</kbd></div>
          <div class="menu-row">
            <button class="mini secondary" type="button" data-mode="camera" data-i18n="menu.input.camera"></button>
            <button class="mini secondary" type="button" data-mode="mouse" data-i18n="menu.input.mouse"></button>
            <button class="mini secondary" type="button" data-menu="hand" aria-pressed="false"><span data-i18n="menu.showHand"></span><kbd>H</kbd></button>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-label"><span data-i18n="menu.handedness"></span><span class="menu-extra" data-i18n="menu.handednessHint"></span></div>
          <div class="menu-row">
            <button class="mini secondary" type="button" data-handedness="right" aria-pressed="false" data-i18n="menu.handedness.right"></button>
            <button class="mini secondary" type="button" data-handedness="left" aria-pressed="false" data-i18n="menu.handedness.left"></button>
          </div>
        </div>
      </div>
      <div class="menu-col">
        <div class="menu-group">
          <div class="menu-label"><span data-i18n="menu.tempo"></span><span class="menu-extra" id="menuBpm"></span></div>
          <div class="menu-grid">
            <button class="mini secondary" type="button" data-tempo="click" id="metronomeButton" aria-pressed="false"><span data-i18n="tempo.click"></span><kbd>K</kbd></button>
            <button class="mini secondary" type="button" data-tempo="half"><span data-i18n="tempo.half"></span><kbd>[</kbd></button>
            <button class="mini secondary" type="button" data-tempo="double"><span data-i18n="tempo.double"></span><kbd>]</kbd></button>
            <button class="mini secondary" type="button" data-tempo="slower"><span data-i18n="tempo.slower"></span><kbd>;</kbd></button>
            <button class="mini secondary" type="button" data-tempo="faster"><span data-i18n="tempo.faster"></span><kbd>'</kbd></button>
            <button class="mini secondary" type="button" data-tempo="earlier"><span data-i18n="tempo.earlier"></span><kbd>,</kbd></button>
            <button class="mini secondary" type="button" data-tempo="later"><span data-i18n="tempo.later"></span><kbd>.</kbd></button>
            <button class="mini secondary" type="button" data-tempo="reset"><span data-i18n="tempo.reset"></span><kbd>0</kbd></button>
          </div>
          <div class="menu-hint" data-i18n="menu.tempoHint"></div>
        </div>
        <div class="menu-group">
          <div class="menu-label"><span data-i18n="menu.advanced"></span></div>
          <div class="menu-row">
            <button class="mini secondary" type="button" data-menu="keyGuard" aria-pressed="false" data-i18n="menu.keyGuard"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="menu-foot">
      <button type="button" data-menu="close" data-i18n="menu.done"></button>
      <button class="secondary" type="button" data-menu="changeSong" data-i18n="menu.changeSong"></button>
      <button class="secondary" type="button" data-menu="lab" data-i18n="menu.lab"></button>
    </div>
  </section>

  <section id="intro" class="overlay">
    <h1><span data-i18n="intro.title"></span><small data-i18n="intro.subtitle"></small></h1>
    <p class="lead" data-i18n="intro.lead"></p>
    <div class="mode-switch" role="group" aria-labelledby="modeLabel">
      <span id="modeLabel" class="mode-label" data-i18n="intro.modeLabel"></span>
      <button class="mini secondary" type="button" data-mode="camera" data-i18n="menu.input.camera"></button>
      <button class="mini secondary" type="button" data-mode="mouse" data-i18n="menu.input.mouse"></button>
    </div>
    <p class="hint" id="modeHint"></p>
    <div class="buttons">
      <button id="pickButton" data-i18n="intro.pick"></button>
      <button id="demoButton" class="secondary" data-i18n="intro.demo"></button>
    </div>
    <input type="file" id="fileInput" accept="audio/*" hidden>
    <button class="mini secondary intro-lab" type="button" data-menu="lab" data-i18n="intro.lab"></button>
    <p class="hint" data-i18n="intro.camera"></p>
    <p class="hint" data-i18n="intro.privacy"></p>
    <p class="message" id="introMessage"></p>
    <p class="credits" data-i18n="credits"></p>
  </section>

  <section id="analyzing" class="overlay" hidden>
    <h2 data-i18n="analyzing.title"></h2>
    <div class="bar"><div id="analyzeFill"></div></div>
    <p class="hint" id="analyzeText"></p>
  </section>

  <section id="ending" class="overlay" hidden>
    <h2 data-i18n="ending.title"></h2>
    <div id="finalScore">0</div>
    <div class="stats">
      <div><span id="statCombo">0</span><em data-i18n="ending.maxCombo"></em></div>
      <div><span id="statPerfect">0</span><em data-i18n="ending.perfect"></em></div>
      <div><span id="statGood">0</span><em data-i18n="ending.good"></em></div>
    </div>
    <div class="buttons">
      <button id="againButton" data-i18n="ending.again"></button>
      <button id="changeButton" class="secondary" data-i18n="ending.change"></button>
    </div>
    <p class="hint" id="endingSummary"></p>
    <p class="hint" data-i18n="ending.note"></p>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
